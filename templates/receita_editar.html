{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Receita — {{ produto.nome }}</h1>
<form method="post" id="formReceita">
<div class="card border-0 shadow-sm mb-3"><div class="card-body">
<label class="form-label">Rendimento da receita</label>
<input class="form-control" style="max-width:250px" type="number" step="0.001" min="0.001" name="rendimento" value="{{ receita.rendimento if receita else 1 }}" required>
<small class="text-muted">Ex.: receita base rende 100 pães.</small>
</div></div>

<div class="card border-0 shadow-sm"><div class="card-body">
<h5>Insumos utilizados</h5>
<table class="table" id="itens"><thead><tr><th>Insumo</th><th>Quantidade na receita base</th><th></th></tr></thead><tbody>
{% if receita %}
{% for item in receita.itens %}
<tr>
<td><select class="form-select" name="insumo_id" required>
{% for i in insumos %}<option value="{{ i.id }}" {% if i.id==item.insumo_id %}selected{% endif %}>{{ i.nome }} ({{ i.unidade_medida }})</option>{% endfor %}
</select></td>
<td><input class="form-control" type="number" step="0.001" min="0.001" name="quantidade" value="{{ item.quantidade }}" required></td>
<td><button type="button" class="btn btn-outline-danger" onclick="this.closest('tr').remove()">Remover</button></td>
</tr>
{% endfor %}
{% endif %}
</tbody></table>
<button type="button" class="btn btn-outline-secondary" onclick="addItem()">+ Insumo</button>
<button class="btn btn-dark">Salvar receita</button>
</div></div>
</form>

<template id="linha">
<tr>
<td><select class="form-select" name="insumo_id" required>
<option value="">Selecione...</option>
{% for i in insumos %}<option value="{{ i.id }}">{{ i.nome }} ({{ i.unidade_medida }})</option>{% endfor %}
</select></td>
<td><input class="form-control" type="number" step="0.001" min="0.001" name="quantidade" required></td>
<td><button type="button" class="btn btn-outline-danger" onclick="this.closest('tr').remove()">Remover</button></td>
</tr>
</template>
{% endblock %}
{% block scripts %}
<script>
function addItem(){
  document.querySelector("#itens tbody").appendChild(document.querySelector("#linha").content.cloneNode(true));
}
{% if not receita or not receita.itens %}addItem();{% endif %}
</script>
{% endblock %}
