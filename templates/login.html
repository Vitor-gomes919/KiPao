{% extends "base.html" %}
{% block title %}Login — Ki-Pão{% endblock %}
{% block content %}
<div class="login-box">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h1 class="h3 fw-bold">🥖 Sistema Ki-Pão</h1>
      <p class="text-muted">Gestão integrada e controle de estoque</p>
      <form method="post">
        <label class="form-label">E-mail</label>
        <input class="form-control mb-3" type="email" name="email" required autofocus>
        <label class="form-label">Senha</label>
        <input class="form-control mb-3" type="password" name="senha" required>
        <button class="btn btn-dark w-100">Entrar</button>
      </form>
      <hr>
      <small class="text-muted">Acesso inicial: admin@kipao.local / admin123</small>
    </div>
  </div>
</div>
{% endblock %}
